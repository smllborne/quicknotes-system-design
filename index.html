<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="tagline">API client prototype (talks to JSONPlaceholder)</p>
  </header>

  <main>
    <section aria-labelledby="create-heading" class="card">
      <h2 id="create-heading">Create a note</h2>
      <form id="note-form" novalidate>
        <label for="title-input">Title (required, max 100 characters)</label>
        <input id="title-input" type="text" name="title" autocomplete="off">

        <label for="body-input">Body (optional)</label>
        <textarea id="body-input" name="body" rows="4"></textarea>

        <button id="submit-btn" type="submit">Add note</button>
      </form>
    </section>

    <section aria-labelledby="notes-heading" class="card">
      <h2 id="notes-heading">Your notes</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>
</body>
</html>
